name: "CMake build"

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.toolchain }} (C++${{ matrix.cppstandard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - linux-gcc
          - macos-clang
          - windows-msvc
          - windows-mingw
        cppstandard:
          - 11
          - 17
          - 20
          - 23
        cstandard:
          - 17
        configuration:
          - Debug
        include:
          - toolchain: linux-gcc
            os: ubuntu-latest
            compiler: gcc
          - toolchain: macos-clang
            os: macos-latest
            compiler: clang
          - toolchain: windows-msvc
            os: windows-latest
            compiler: msvc
          - toolchain: windows-mingw
            os: windows-latest
            compiler: mingw
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure (${{ matrix.configuration }})
        run: |
          if [ "${{ matrix.compiler }}" == "msvc" ]; then
            cmake -S . -B build -DBUILD_TESTS=ON -DCMAKE_CXX_STANDARD=${{ matrix.cppstandard }} -DUNICODE=ON -D_UNICODE=ON -DCMAKE_C_STANDARD=${{ matrix.cstandard }}
          elif [ "${{ matrix.compiler }}" == "mingw" ]; then
            cmake -S . -B build -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DUNICODE=ON -D_UNICODE=ON -DCMAKE_CXX_STANDARD=${{ matrix.cppstandard }} -DCMAKE_C_STANDARD=${{ matrix.cstandard }} -G "MinGW Makefiles"
          else
            cmake -S . -B build -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DUNICODE=ON -D_UNICODE=ON -DCMAKE_CXX_STANDARD=${{ matrix.cppstandard }} -DCMAKE_C_STANDARD=${{ matrix.cstandard }}
          fi
      - name: Build with ${{ matrix.compiler }}
        run: |
          if [ "${{ matrix.compiler }}" == "msvc" ]; then
            cmake --build build --config ${{ matrix.configuration }}
          else
            cmake --build build -- -j8
          fi
      - name: Test
        run: |
          ctest --test-dir build --build-config ${{ matrix.configuration }} --verbose

  windows-mingw-w64:
    # Dedicated job (rather than another `build` matrix entry) because it
    # needs the msys2 shell and an explicitly installed, current mingw-w64
    # GCC toolchain - closer to what a Windows 10 user following winlibs.com
    # (see issue #48) actually builds with than whatever mingw happens to be
    # preinstalled on the windows-latest runner for the `windows-mingw` entry
    # above.
    name: windows-mingw-w64 (MSYS2 GCC)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up MSYS2 mingw-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DUNICODE=ON -D_UNICODE=ON
      - name: Build
        run: |
          cmake --build build
      - name: Test
        run: |
          ctest --test-dir build --build-config Debug --verbose

  openframeworks-tests:
    # Builds this FreeImage checkout and drops it into a real openFrameworks
    # checkout in place of oF's own prebuilt copy, then runs oF's
    # tests/graphics/imageFormats suite (save/load/pixel-verify round trip
    # through ofImage for several formats) against it. Catches regressions
    # that only show up when FreeImage is actually linked into a consuming
    # application rather than exercised through FreeImage's own TestAPI.
    name: openFrameworks image format tests (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout FreeImage
        uses: actions/checkout@v4
        with:
          path: freeimage
      - name: Checkout openFrameworks
        uses: actions/checkout@v4
        with:
          repository: openFrameworks/openFrameworks
          ref: master
          path: openFrameworks
          submodules: true
      - name: Download openFrameworks prebuilt dependencies
        run: openFrameworks/scripts/macos/download_libs.sh
      - name: Build FreeImage against oF's own zlib/libpng
        # oF's core already links its own zlib.a/libpng.a; bundling FreeImage's
        # copies too would duplicate-symbol at final link time, so build
        # against oF's copies instead, matching how oF's apothecary formula
        # builds FreeImage for its own releases.
        run: |
          LIBPNG_DIR="$GITHUB_WORKSPACE/openFrameworks/libs/libpng"
          ZLIB_DIR="$GITHUB_WORKSPACE/openFrameworks/libs/zlib"
          cmake -S freeimage -B build-of \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -DBUILD_LIBPNG=OFF -DPNG_INCLUDE_DIR="$LIBPNG_DIR/include" -DPNG_LIBRARY="$LIBPNG_DIR/lib/macos/libpng.xcframework/macos-arm64_x86_64/libpng.a" \
            -DBUILD_ZLIB=OFF -DZLIB_ROOT="$ZLIB_DIR" -DZLIB_INCLUDE_DIRS="$ZLIB_DIR/include" -DZLIB_LIBRARY="$ZLIB_DIR/lib/macos/zlib.xcframework/macos-arm64_x86_64/zlib.a"
          cmake --build build-of -j"$(sysctl -n hw.ncpu)"
      - name: Swap this FreeImage build into the openFrameworks checkout
        run: |
          OF_ARCH_DIR="$GITHUB_WORKSPACE/openFrameworks/libs/FreeImage/lib/macos/FreeImage.xcframework/macos-arm64_x86_64"
          cp freeimage/Source/FreeImage.h openFrameworks/libs/FreeImage/include/FreeImage.h
          cp freeimage/Source/FreeImage.h "$OF_ARCH_DIR/Headers/FreeImage.h"
          cp build-of/libFreeImage.a "$OF_ARCH_DIR/FreeImage.a"
      - name: Build and run the FreeImage image format test
        working-directory: openFrameworks/tests/graphics/imageFormats
        run: |
          # Makefile/config.make are gitignored in oF's test dirs - the test
          # harness is expected to supply them, same as oF's own run_tests.sh
          cp ../../../scripts/templates/macos/Makefile .
          cp ../../../scripts/templates/macos/config.make .
          make -j"$(sysctl -n hw.ncpu)" Debug
          make RunDebug

  make-build:
    # Plain `make` (Makefile.gnu, via the top-level Makefile dispatcher) is
    # a separate build path from CMake with its own hand-maintained file
    # list in Makefile.srcs - nothing else in this workflow exercises it, so
    # it can silently drift out of sync with the source tree (see #33, and
    # the OpenEXR/openjpeg bump breaking it entirely) without any CI signal.
    name: make build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build
        run: make -j"$(nproc)"
      - name: Verify build artifacts exist
        run: |
          test -f "libfreeimage.a"
          test -f "libfreeimage-3.19.0.so"
